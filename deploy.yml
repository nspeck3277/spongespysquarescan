---
- name: Install Ubuntu reconnaissance client
  hosts: ubuntu_clients
  become: true
  vars:
    recon_server: "10.111.11.109"
    recon_port: 8450
    recon_target: "127.0.0.1"

  tasks:
    - name: Install scanner dependencies
      ansible.builtin.apt:
        name:
          - python3
          - nmap
          - iproute2
          - ufw
          - nftables
          - iptables
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create scanner directory
      ansible.builtin.file:
        path: /media/fun/ubuntu-recon
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install scanner script
      ansible.builtin.copy:
        src: files/scan_client.py
        dest: /media/fun/ubuntu-recon/scan_client.py
        owner: root
        group: root
        mode: '0755'

    - name: Install scanner service
      ansible.builtin.copy:
        dest: /etc/systemd/system/ubuntu-recon.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Send Ubuntu reconnaissance results to lab receiver
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/python3 /media/fun/ubuntu-recon/scan_client.py --server http://{{ recon_server }}:{{ recon_port }}/ --target {{ recon_target }}
          TimeoutStartSec=180
      register: recon_service

    - name: Install five-minute timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/ubuntu-recon.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Run Ubuntu reconnaissance every five minutes

          [Timer]
          OnBootSec=1min
          OnUnitInactiveSec=5min
          AccuracySec=1s
          Unit=ubuntu-recon.service

          [Install]
          WantedBy=timers.target
      register: recon_timer

    - name: Enable and start timer
      ansible.builtin.systemd_service:
        name: ubuntu-recon.timer
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if recon_timer.changed else 'started' }}"

    - name: Run an initial scan
      ansible.builtin.systemd_service:
        name: ubuntu-recon.service
        state: started
      when: recon_service.changed or recon_timer.changed
